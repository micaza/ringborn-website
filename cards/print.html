<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Last Sideran — Business Card Print</title>
  <style>
    @page {
      size: 3.5in 2in;
      margin: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #222;
      font-family: system-ui, sans-serif;
      color: #ccc;
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #999;
    }

    .sheet {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      width: 3.5in;
      height: 2in;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pair {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pair-label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }

      h1, p, .pair-label, .instructions { display: none; }

      .sheet {
        gap: 0;
        margin: 0;
      }

      .pair {
        gap: 0;
        page-break-after: always;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h1>The Last Sideran — Business Cards</h1>
    <p>Standard size 3.5″ × 2″. Print at 100% scale with no margins. Use card stock, print front and back separately (or duplex if aligned).</p>
  </div>

  <div class="sheet">
    <div class="pair">
      <span class="pair-label">Front</span>
      <div class="card"><img src="business-card-front.png" alt="Business card front"></div>
    </div>
    <div class="pair">
      <span class="pair-label">Back</span>
      <div class="card"><img src="business-card-back.png" alt="Business card back"></div>
    </div>
  </div>
</body>
</html>
